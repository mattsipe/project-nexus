title: Clumsy Bird
tagline: Tap to flap. The gap is always exactly where you are not.
description: >-
  The one-button flyer, done properly in melonJS. Tap or press space to flap,
  don't touch a pipe, and accept that your best run will end for no reason you
  can name.
