title: HexGL
tagline: Anti-gravity racing at three hundred miles an hour, in a browser tab.
description: >-
  A futuristic hover racer built on WebGL — magnetic track, boost pads, and a
  ship that scrapes the walls if you take a corner badly. Thibaut Despoulain
  wrote it to show what the open web could do in 2012, and it still holds up.
