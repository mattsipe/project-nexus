title: Star Battle
tagline: Fuel drains a point a second. Shoot what you must, catch what you can.
description: >-
  A side-on space shooter with a clock built into it: fuel starts at fifteen
  and falls every second, so every detour to catch a canister is a real
  decision. Enemies are worth points, friendlies cost them, and the score is
  allowed to go negative.
