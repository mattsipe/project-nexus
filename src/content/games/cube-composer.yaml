title: Cube Composer
tagline: Turn one stack of cubes into another, using only the functions you are given.
description: >-
  Each level shows a starting arrangement of coloured cubes and a target, and
  hands you a small set of transformations to chain together. It is a
  functional-programming exercise wearing a very good disguise.
categories: [puzzle]
tags: [functional, transformation, logic, thinky]
