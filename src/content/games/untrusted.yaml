title: Untrusted
tagline: The level is a JavaScript file. Edit it, and walk out.
description: >-
  You are trapped in a maze whose source code sits open beside it. Every level
  hands you a different function to rewrite — move a wall, redefine a monster,
  change what a key does — and the game runs whatever you write. A programming
  puzzle that never feels like a tutorial.
