title: A Dark Room
tagline: A fire, a room, and the dark outside. It does not stay that way.
description: >-
  It begins with one button and a cold room. What it becomes is best not
  spoiled — but it is a strategy game, it is much longer than it looks, and it
  is one of the few games that uses plain text as a deliberate choice rather
  than a limitation.
categories: [strategy, incremental]
tags: [text, survival, long-haul, exploration]
