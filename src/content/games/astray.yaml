title: Astray
tagline: Roll a marble through a lit maze you can only see one corridor of.
description: >-
  A first-person marble maze in real 3D, lit so that the corridor you are in
  is the only one you can read. Tilt the ball with the arrow keys and find the
  way out. Rye Terrell released it into the public domain.
