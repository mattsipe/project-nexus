title: Cookie Clicker
tagline: Click the cookie. Then buy something that clicks it for you.
description: >-
  The game that defined the whole idle genre. One cookie, one click, and a
  purchasing tree that ends somewhere much stranger than it starts. Orteil has
  kept it updated for over a decade.
categories: [incremental, classic]
tags: [idle, clicker, famous, long-haul]
delivery:
  mode: external
  url: https://orteil.dashnet.org/cookieclicker/
  reason: >-
    Proprietary, with no redistribution grant. Embedding is not possible either:
    orteil.dashnet.org sits behind a Cloudflare bot challenge, and the challenge
    page itself sends X-Frame-Options SAMEORIGIN, so any visitor who gets
    challenged would see an empty frame. Sites that appear to embed Cookie
    Clicker are serving their own copied build, which we will not do. Orteil has
    also objected to the game being embedded. Re-verified in a real browser on
    2026-08-22.
accent: "#c98b4a"
cover:
  capsule: /covers/cookie-clicker-capsule.svg
  hero: /covers/cookie-clicker-hero.svg
  source: original
  verifiedOn: "2026-08-22"
  rightsNote: >-
    Hand-drawn (scripts/make-original-covers.ts) — a cookie and the game's own cookies-per-second readout, using its real building names, checked against the live game on 2026-08-22. No screenshot or art copied.
weight: 30
added: "2026-08-22"
controls: [mouse]
fullscreen: unsupported
savesTo: none
