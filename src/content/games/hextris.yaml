title: Hextris
tagline: A hexagon spins, blocks fall, colours must meet colours.
description: >-
  Rotate the hexagon so falling blocks land on matching colours. Three in a row
  clears them. It starts gentle and becomes genuinely frantic — an arcade puzzle
  in the truest sense.
categories: [puzzle, arcade]
tags: [hexagon, colour-match, reflex, quick]
