  url: https://www.micropolis.com
cover:
  capsule: /covers/micropolis-js-capsule.svg
  hero: /covers/micropolis-js-hero.svg
  source: original
  verifiedOn: "2026-08-22"
  rightsNote: >-
    Hand-drawn (scripts/make-original-covers.ts) as a zoning grid using the game's own R/C/I vocabulary, checked against the live game on 2026-08-22. Drawn rather than captured because the trademark licence governs the name, and borrowing the game's own imagery alongside it would blur a boundary worth keeping sharp.
weight: 72
