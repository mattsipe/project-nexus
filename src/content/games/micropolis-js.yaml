  rightsNote: >-
    LICENSE and MicropolisPublicNameLicense.md both read at repo root on
    2026-08-22. GPL-3.0 permits redistribution with source availability and
    change notices, both provided. Previously embedded on the assumption that
    the repo shipped only TypeScript source; re-checked on 2026-08-22, the
