title: Micropolis
tagline: Zone it, wire it, tax it, and try to keep the fires out.
description: >-
  The open-source release of the original city simulator, rebuilt for the
  browser. Paint residential, commercial and industrial zones, run power to
  them, set a budget, and find out how quickly a city stops doing what you
  intended.
categories: [strategy, sandbox]
tags: [city-builder, simulation, zoning, long-haul]
delivery:
  mode: embed
  url: https://graememcc.github.io/micropolisJS/
  embedVerifiedOn: "2026-08-22"
  embedNote: >-
    HEAD request returned 200 with no X-Frame-Options and no CSP
    frame-ancestors directive on the author's official GitHub Pages build.
