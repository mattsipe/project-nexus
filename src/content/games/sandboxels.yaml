title: Sandboxels
tagline: Drop sand, pour water, light a fire, and watch the chemistry argue.
description: >-
  A falling-sand sandbox with hundreds of elements and real reactions between
  them — heat, density, electricity, combustion. There is no goal. Build a
  forest and set it alight, or freeze a lake and see what cracks.
