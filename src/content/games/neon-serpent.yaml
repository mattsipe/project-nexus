title: Neon Serpent
tagline: Grid-perfect snake that reads as smooth. Getting long is the problem.
description: >-
  Our own take on the oldest arcade idea there is. It runs on a strict grid so
  collisions are always fair, but draws between ticks so the motion is fluid
  rather than steppy. Gets faster every four pellets.
