title: Space Huggers
tagline: Run, gun, and blow holes in the level until nothing is left standing.
description: >-
  A run-and-gun roguelike where the terrain is as destructible as the enemies.
  Shoot through a wall rather than round it, drop through the floor you just
  made, and keep moving. Frank Force built the whole thing to fit in 13
  kilobytes for js13kGames.
