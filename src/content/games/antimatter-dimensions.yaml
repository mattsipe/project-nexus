title: Antimatter Dimensions
tagline: Buy a dimension. Buy a dimension that buys dimensions. Keep going.
description: >-
  The incremental that taught a generation what an exponent feels like. You
  start by clicking for antimatter and end up resetting entire universes for a
  multiplier. Expect to be here for a while.
categories: [incremental]
tags: [prestige, big-numbers, idle, long-haul]
