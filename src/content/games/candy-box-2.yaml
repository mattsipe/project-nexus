title: Candy Box 2
tagline: You have candies. That is the whole premise, and it is a lie.
description: >-
  It opens as a counter ticking upward in plain text and turns into a
  full role-playing game with a map, a forge and genuinely hard fights — all
  still drawn in ASCII. The joke is that none of it is a joke.
categories: [incremental, classic]
tags: [ascii, rpg, idle, surprising]
