title: Bitburner
tagline: A hacking RPG you play by actually writing JavaScript.
description: >-
  Start with a terminal and no money. Learn the commands, then automate them,
  then write scripts that run your whole operation while you sleep. The
  programming is the game, not a metaphor for it.
categories: [incremental, strategy]
tags: [programming, terminal, idle, automation]
