title: Racer
tagline: Pseudo-3D road racing, the way arcade cabinets did it before polygons.
description: >-
  No 3D engine — just a stack of scaled sprites and a curved road drawn one
  segment at a time, exactly how the coin-op racers of the eighties faked
  depth. Jake Gordon built it as a write-up of the technique, and it plays
  like the thing it explains.
categories: [racing, arcade]
tags: [retro, pseudo-3d, road, arcade-racer]
delivery:
  mode: selfhost
  path: /play/racer/index.html
player:
  # Upstream CSS-pinned the canvas to 640x480 regardless of frame size (33% of
  # a 1920 display). The bundle now stretches the canvas to fill, so the player
  # only has to hand it a correctly-shaped box.
  aspect: "4/3"
  orientation: landscape
accent: "#f2b21c"
cover:
  capsule: /covers/racer-capsule.png
  hero: /covers/racer-hero.png
  source: captured
  verifiedOn: "2026-08-21"
  rightsNote: >-
    Screenshot of our own self-hosted build at speed, captured via scripts/capture-covers.ts on 2026-08-21. Inherits the game's MIT licence; no separate rights question.
weight: 64
added: "2026-08-21"
controls: [keyboard]
fullscreen: supported
savesTo: none
source:
  author: Jake Gordon
  homepage: https://codeincomplete.com/articles/javascript-racer/
  repo: https://github.com/jakesgordon/javascript-racer
