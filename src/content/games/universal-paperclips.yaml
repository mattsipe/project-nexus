title: Universal Paperclips
tagline: Make a paperclip. Make another. Do not think too hard about where this ends.
description: >-
  You run a paperclip factory, and then you run rather more than that. Frank
  Lantz's game is the clearest thing ever written about optimisation pressure,
  and it takes about four hours to make its point.
