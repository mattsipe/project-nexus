title: Belt Runner
tagline: Thrust, turn, and shoot rocks into smaller rocks. Vector lines, nothing else.
description: >-
  Doug McInnes's canvas rebuild of the vector-arcade classic, played entirely
  in thin white lines. Rotate, thrust, fire; every rock you break becomes two
  faster ones. Nexus ships it under its own name — the code is Doug's and the
  attribution stays with him.
categories: [arcade, classic]
