<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Neon Serpent</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <header id="hud">
      <div class="stat"><span class="label">Score</span><span id="score" class="value">0</span></div>
      <div class="stat"><span class="label">Best</span><span id="best" class="value">0</span></div>
      <div class="stat"><span class="label">Speed</span><span id="speed" class="value">1</span></div>
    </header>

    <div id="board">
      <canvas id="canvas" aria-label="Neon Serpent game board" role="img"></canvas>

      <div id="overlay" class="panel">
        <h1>Neon Serpent</h1>
        <p id="overlay-text">Eat the pellets. Do not eat yourself.</p>
        <button id="start" type="button">Start</button>
        <p class="hint">Arrow keys or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to steer · <kbd>P</kbd> to pause · swipe on touch</p>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
